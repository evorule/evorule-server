[package]
name = "evorule-server"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-or-later"
description = "EvoRule 框架官方 HTTP server 实现 — 把 evorule-tcb/reactor 暴露为远程 API"
repository = "https://gitee.com/evorule/evorule-server"
homepage = "https://gitee.com/evorule/evorule-server"
readme = "../README.md"
publish = false

[lib]
name = "evorule_server"
path = "src/lib.rs"

[[bin]]
name = "evorule-server"
path = "src/main.rs"

[dependencies]
# 核心层 (crates.io 版本依赖)
# 0.4.2 起 evorule-tcb/reactor 携带规则命中归因（RuleHit/TransitionTrace），
# server 侧消费该事实做聚合。发布顺序：evorule 0.4.2 先发 crates.io，本仓随后（D8 同发同装）。
evorule-tcb = { version = "0.4.2" }
evorule-reactor = { version = "0.4.2", features = ["persistence"] }
# H6: evorule-governance 不再有 metrics/auth feature（IoMetrics trait 总是可用，auth 迁移到应用层）
evorule-governance = { version = "0.4.2", features = ["persistence"] }
# 审计档案链哈希重算
blake3 = "1"

# 平台用户口令哈希; OsRng 亦用于会话 token 生成
argon2 = { version = "0.5", features = ["std"] }

# I/O handler(H5: 应用层,从 evorule-governance 迁出; 新位置: core/io_handlers)
evorule-io-handlers = { path = "../core/io_handlers" }

# Workspace crate (P10: 多租户工作空间 + 规则元数据管理)
evorule-workspace = { path = "../core/workspace" }

# Schema 门禁（线1 防御层）：/api/rules/validate 提交校验的权威基准
evorule-rule-schema = { path = "../core/rule_schema" }

# 快照包共享校验（36 号 集成契约；6 项校验链 + 逐条 Schema 门禁 + 原子落盘）
evorule-bundle = { version = "0.3.0" }

# Phase 1: yuanze-demos 业务服务 Rust 原生实现（复合路由：原生优先，HTTP 回落）
evorule-demo-services = { path = "../plugins/demo-services" }

# : 确定性物理仿真原生插件（第二个进程内插件,泛化验证载体）
evorule-physics-services = { path = "../plugins/physics-services" }

# : 确定性金融技术指标原生插件（第三个进程内插件,Python 重写移植模式载体）
evorule-indicator-services = { path = "../plugins/indicator-services" }

# 插件机制公共件（trait/声明项/过滤路由器上提归一,main.rs PLUGIN_DEFS 直引声明表挂载）
evorule-plugin-kit = { path = "../core/plugin-kit" }

# 异步运行时
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "time",
    "signal",
] }

# HTTP API(直接使用 axum 类型;multipart 供模板市场上传 W4)
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "fs"] }
tower_governor = "0.8"
governor = "0.10"
# H6: async-stream 和 futures-core 从 evorule-governance 迁移（server.rs 的 SSE stream! 宏需要）
async-stream = "0.3"
futures-core = "0.3"

# Prometheus 指标（H6: 从 evorule-governance 迁移到应用层）
# Phase 3: 升级到 0.14 修复 RUSTSEC-2024-0437（protobuf 2.28.0 不受控递归 DoS）
prometheus = "0.14"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
thiserror = "2"

# OpenAPI 单一真相源 (P2-1): utoipa 从代码生成规范，运行时经 /api/openapi.json 导出
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# CLI 参数解析
clap = { version = "4", features = ["derive", "env"] }

# 安全(恒定时间比较)
subtle = "2"

# async trait (WC-10: SessionOps for SessionApi 需要)
async-trait = "0.1"

# Phase 1: 第一层输入净化（正则匹配 + 静默改写，可复用公共服务）
regex = "1"
pdf-writer = "0.15.0"
ttf-parser = "0.25.1"
subsetter = "0.2.6"

[dev-dependencies]
# H6: benchmarks 迁移到应用层后需要的依赖
# bench_determinism/long_session/throughput 通过 HTTP 调用 evorule-server 进行压测
# : rustls TLS——Linux musl 静态发版构建不依赖系统 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# bench_determinism 计算 payload hash (审计⑥ C3: 统一走 evorule-hash)
evorule-hash = "0.1.3"
# 配置解析测试需要临时文件
tempfile = "3"
# handler oneshot 测试需要 ServiceExt::oneshot（util feature）
tower = { version = "0.5", features = ["util"] }
# Q12 端到端验收（tests/q12_data_asset_e2e.rs）：治理侧 knowledge 数据集 4 步
# → export_knowledge → 执行侧 import_bundle → KnowledgeStore 直读全链。
# 仅 dev 依赖，不进生产依赖图；evorule-bundle/evorule-hash 经 workspace patch
# 收敛到同一本地源，治理侧与执行侧校验口径同源。
# CI 兼容：三仓集成测试（acceptance_full_chain/binding_e2e/
# q12_data_asset_e2e）依赖兄弟仓 evorule-rule，CI 检出布局无此仓 →
# 原写法 path="../../evorule-rule" 使 workspace manifest 加载必挂（fmt/clippy/
# build/test 连锁红）。改为 git 依赖锁 rev（CI 可独立 resolve）+ feature 门控
# full-chain-tests + 三个 [[test]] required-features（CI 默认不编译这三个
# 跨仓测试，测试命令去掉 --all-features；本地联测见 scripts/ 文档）。
# 本地用工作区版本：.cargo/config.toml（gitignore，不进 CI）加
# [patch."https://gitee.com/evorule/evorule-rule.git"]
# evorule-rule = { path = "../../evorule-rule" }
# 待 evorule-rule 发版 crates.io 后可切换为 version 依赖进一步简化。
evorule-rule = { git = "https://gitee.com/evorule/evorule-rule.git", rev = "28d35aef03d58b8916c4036ac4d55b808052162e" }

[features]
# H6: metrics feature 已移除（Prometheus 实现始终启用，由 metrics_impl.rs 提供）
# evorule-governance 不再有 metrics feature（IoMetrics trait 总是可用）
default = ["persistence"]
persistence = ["evorule-governance/persistence", "evorule-reactor/persistence"]
# 跨仓全链集成测试门控开关（dev-dep git 形态不可 optional，故本 feature
# 仅作 [[test]] required-features 门控，不绑定依赖）
full-chain-tests = []

# 三个跨仓集成测试须显式启用 full-chain-tests 才编译
[[test]]
name = "acceptance_full_chain"
required-features = ["full-chain-tests"]

[[test]]
name = "binding_e2e"
required-features = ["full-chain-tests"]

[[test]]
name = "q12_data_asset_e2e"
required-features = ["full-chain-tests"]

[lints]
# 继承顶层 [workspace.lints] (C4 forbid unsafe / C5 unwrap·expect·panic = deny)
workspace = true
