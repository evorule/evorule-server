# CLA Assistant 配置（托管版 cla-assistant.io）
# 企业贡献者（非个人）：签署前先阅 CLA-corporate.md 并联系 evorulelab@gmail.com 完成企业级 CLA，再在 PR 签署。
#
# 启用方式: 在 GitHub 安装 "CLA Assistant" App 并授权本仓库即生效, 无需额外 workflow。
# 贡献者在 PR 中评论以下语句即完成签署:
#   I have read the CLA Document and I hereby sign the CLA
# 签署记录由 App 自动提交到本仓库 signatures/version1/cla.json。
#
# 文档: CLA-individual.md (AGPL-3.0 + 商业双重许可下的个人贡献者许可协议)
# 组织: EvoRule Project | 邮箱 evorulelab@gmail.com

contract-recipient: 'EvoRule Project'
sign-url: 'https://github.com/evorule/evorule-server/blob/main/CLA-individual.md'
organization:
  name: 'evorule'
  provider: 'github'
repositories:
  - 'evorule'
  - 'evorule-server'
path-to-cla-document: 'CLA-individual.md'
path-to-signatures: 'signatures/version1/cla.json'
branch: 'main'
