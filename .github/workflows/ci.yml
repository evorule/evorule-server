name: CI

on:
  push:
    branches: [main, dev/wip]
  pull_request:
    branches: [main, dev/wip]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===== Lint (clippy + fmt) =====
  lint:
    name: Clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system deps (SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ===== 文档安全 + 版本一致性（各仓独立发布 · 强阻塞）=====
  docs-check:
    name: Doc safety + version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查 Python 版本
        run: python3 --version

      # VERSION_STRATEGY 基线五件套
      - name: validate-version.ps1
        shell: pwsh
        run: pwsh -NoProfile -File scripts/validate-version.ps1
      - name: validate-changelog.ps1
        shell: pwsh
        run: pwsh -NoProfile -File scripts/validate-changelog.ps1
      - name: validate-license.ps1（SPDX 头 + LICENSE 文件）
        shell: pwsh
        run: pwsh -NoProfile -File scripts/validate-license.ps1
      - name: validate-cargolock.ps1
        shell: pwsh
        run: pwsh -NoProfile -File scripts/validate-cargolock.ps1
      - name: validate-release.ps1（tag 格式校验，-SkipTagCheck 跳过 tag 存在性）
        shell: pwsh
        run: pwsh -NoProfile -File scripts/validate-release.ps1 -SkipTagCheck

      # 文档安全 + 引用完整性 + 基调合规（强阻塞）
      # 7 类检查：R-门控1 staged文档泄露 / R3 L1私有路径泄露 / L1不提L2L3 / R-兄弟仓零谈论 / R-agent身份零泄露 / 交叉引用完整性 / DOCS_INDEX索引存在性
      - name: check_doc_safety.py
        run: python3 scripts/check_doc_safety.py --skip-git

  # ===== Rust tests =====
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: [lint, docs-check]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo test --workspace
        # UV-100: 去掉 --all-features —— full-chain-tests 门控的三个跨仓集成
        # 测试依赖兄弟仓 evorule-rule（git rev dev-dep），CI 默认布局不启用该
        # feature（required-features 未满足不编译）；本地联测见 Cargo.toml 注释
        run: cargo test --workspace

  # ===== Release build =====
  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo build --release
        run: cargo build --release --bin evorule-server

      - name: Upload evorule-server binary
        uses: actions/upload-artifact@v4
        with:
          name: evorule-server-linux-x86_64
          path: target/release/evorule-server
          retention-days: 7
          if-no-files-found: warn

  # ===== Docker image build (no push) =====
  build-docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: evorule-server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test (image can start)
        run: |
          # fail-closed 防护:绑定 0.0.0.0 且无 auth token 时 server
          # 拒绝启动(exit 1)——这是安全防护正确工作,镜像默认配置
          # 违反了它。smoke 属"镜像能起"验证,显式传临时 token 通过防护;
          # /api/health 在 public_routes 无需认证,探测不必携带。
          # 不覆盖 EVORULE_ADDR(镜像默认 0.0.0.0:18080,容器内绑 loopback
          # 会使端口映射确定性失败)。
          docker run --rm -d -p 18080:18080 \
            -e EVORULE_AUTH_TOKEN=smoke-only-token \
            --name evorule-smoke \
            evorule-server:ci-${{ github.sha }}
          # retry-connrefused 覆盖"服务初始化未完成监听"窗口
          curl -sf --retry 10 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:18080/api/health || (docker logs evorule-smoke; exit 1)
          docker stop evorule-smoke || true
