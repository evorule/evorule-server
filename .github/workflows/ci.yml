name: CI

on:
  push:
    branches: [main, dev/wip]
  pull_request:
    branches: [main, dev/wip]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===== Lint (clippy + fmt) =====
  lint:
    name: Clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system deps (SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace
        # --exclude evorule-setup: installer 的 build.rs 在 payload/ 缺失时
        # compile_error!（payload=发版机汇集产物, gitignore 不入库, CI 无法生成,
        # 见 installer/prepare-payload.ps1——依赖本地 release exe/console-cloud 构建）。
        # CI 无产物环境不编译安装器, 其构建与测试验证在发版机本地执行。
        run: cargo clippy --workspace --exclude evorule-setup --all-targets -- -D warnings

  # ===== 文档安全 + 版本一致性（各仓独立发布 · 强阻塞）=====
  docs-check:
    name: Doc safety + version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查 Python 版本
        run: python3 --version

      # VERSION_STRATEGY 基线五件套
      - name: validate-version.ps1
        shell: pwsh
        run: pwsh -NoProfile -File scripts/validate-version.ps1
      - name: validate-changelog.ps1
        shell: pwsh
        run: pwsh -NoProfile -File scripts/validate-changelog.ps1
      - name: validate-license.ps1（SPDX 头 + LICENSE 文件）
        shell: pwsh
        run: pwsh -NoProfile -File scripts/validate-license.ps1
      - name: validate-cargolock.ps1
        shell: pwsh
        run: pwsh -NoProfile -File scripts/validate-cargolock.ps1
      - name: validate-release.ps1（tag 格式校验，-SkipTagCheck 跳过 tag 存在性）
        shell: pwsh
        run: pwsh -NoProfile -File scripts/validate-release.ps1 -SkipTagCheck

      # 文档安全 + 引用完整性 + 基调合规（强阻塞）
      # 6 类检查：R-门控1 staged文档泄露 / R3 L1私有路径泄露 / L1不提L2L3 / R-agent身份零泄露 / 交叉引用完整性 / DOCS_INDEX索引存在性
      - name: check_doc_safety.py
        run: python3 scripts/check_doc_safety.py --skip-git

  # ===== 原生服务声明漂移检查（回归验证/P0-2 · 零 cargo 依赖）=====
  # SSOT = 本仓 plugins/*/official_native_services.json；
  # 治理侧嵌入副本 = evorule-rule src/model/*.embedded.json。
  # fail-closed：漂移即红灯。修复 = 运行 scripts/sync-native-services.ps1
  # 同步后双仓提交（先合入 rule 侧同步，再合入本仓 SSOT 变更）。
  native-services-sync:
    name: Native services drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout evorule-rule（治理侧嵌入副本）
        uses: actions/checkout@v4
        with:
          repository: evorule/evorule-rule
          ref: main
          path: evorule-rule
      - name: 逐字节校验嵌入副本 vs SSOT
        shell: pwsh
        run: pwsh -NoProfile -File scripts/sync-native-services.ps1 -Verify -RepoRule "${{ github.workspace }}/evorule-rule"

  # ===== 依赖漏洞扫描（wasm-host 升级纪律 · 强阻塞）=====
  # wasm-host 是独立项目（自带 Cargo.lock，wasmtime 依赖树不进 server workspace），
  # server 的任何 lock 扫描都覆盖不到它——必须对其 lock 单独扫 RustSec 公告库。
  # 扫描只读 lock 不编译（无需满足 wasmtime 的 MSRV 1.95）。
  # 失败语义 = 发现已知漏洞（vulnerabilities）即红；unmaintained 等警告仅呈现不阻塞。
  audit:
    name: Security audit (wasm-host deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit（预编译二进制，免编译安装）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit（wasm-host 独立 Cargo.lock）
        working-directory: plugins/wasm-host
        run: cargo audit

  # ===== wasm-host 构建与测试（历史遗留项 转立项 · 强阻塞）=====
  # wasm-host 是独立项目（不在 workspace），主 CI 的 lint/test/build 天然不覆盖；
  # audit job 只扫 lock 不编译。本 job 补齐编译正确性与单测验证（历史批次）。
  # MSRV：rust-version = "1.95"（wasmtime 48）；stable 满足，字段本身 fail-fast 兜底。
  wasm-host:
    name: WASM host (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/wasm-host
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/wasm-host
          key: wasm-host-${{ hashFiles('plugins/wasm-host/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  # ===== Rust tests =====
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: [lint, docs-check]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo test --workspace
        # 回归验证: 去掉 --all-features —— full-chain-tests 门控的三个跨仓集成
        # 测试依赖兄弟仓 evorule-rule（git rev dev-dep），CI 默认布局不启用该
        # feature（required-features 未满足不编译）；本地联测见 Cargo.toml 注释
        # --exclude evorule-setup: 同 clippy job 注释（payload 门禁, CI 无法编译 installer）
        run: cargo test --workspace --exclude evorule-setup

  # ===== Release build =====
  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo build --release
        run: cargo build --release --bin evorule-server

      - name: Upload evorule-server binary
        uses: actions/upload-artifact@v4
        with:
          name: evorule-server-linux-x86_64
          path: target/release/evorule-server
          retention-days: 7
          if-no-files-found: warn

  # ===== Docker image build (no push) =====
  build-docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: evorule-server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test (image can start)
        run: |
          # fail-closed 防护:绑定 0.0.0.0 且无 auth token 时 server
          # 拒绝启动(exit 1)——这是安全防护正确工作,镜像默认配置
          # 违反了它。smoke 属"镜像能起"验证,显式传临时 token 通过防护;
          # /api/health 在 public_routes 无需认证,探测不必携带。
          # 不覆盖 EVORULE_ADDR(镜像默认 0.0.0.0:18080,容器内绑 loopback
          # 会使端口映射确定性失败)。
          docker run --rm -d -p 18080:18080 \
            -e EVORULE_AUTH_TOKEN=smoke-only-token \
            --name evorule-smoke \
            evorule-server:ci-${{ github.sha }}
          # 显式循环探测(不用 curl --retry:其重试语义不覆盖全部瞬时错误,
          # 曾出现主 curl 重试用尽失败而数秒后诊断 curl 即成功的误报形态);
          # 60s 窗口,成功须含 success:true(强校验,非仅 200)。
          SMOKE_OK=0
          for i in $(seq 1 30); do
            body=$(curl -sf --max-time 3 http://127.0.0.1:18080/api/health 2>/dev/null || true)
            if [ -n "$body" ] && echo "$body" | grep -q '"success":true'; then
              SMOKE_OK=1
              echo "=== SMOKE PASSED (attempt $i) ==="
              echo "$body"
              break
            fi
            sleep 2
          done
          if [ "$SMOKE_OK" != "1" ]; then
            echo "=== SMOKE FAILED: container state ==="
            docker ps -a --filter name=evorule-smoke || true
            echo "=== SMOKE FAILED: port mapping ==="
            docker port evorule-smoke || true
            echo "=== SMOKE FAILED: curl verbose ==="
            curl -v --max-time 5 http://127.0.0.1:18080/api/health || true
            echo "=== SMOKE FAILED: container logs ==="
            docker logs evorule-smoke || true
            exit 1
          fi
          docker stop evorule-smoke || true
