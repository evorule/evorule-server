name: CI

on:
  push:
    branches: [main, dev/wip]
  pull_request:
    branches: [main, dev/wip]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===== Lint (clippy + fmt) =====
  lint:
    name: Clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system deps (SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ===== Rust tests =====
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo test --workspace
        run: cargo test --workspace --all-features

  # ===== Release build =====
  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo build --release
        run: cargo build --release --bin evorule-server

      - name: Upload evorule-server binary
        uses: actions/upload-artifact@v4
        with:
          name: evorule-server-linux-x86_64
          path: target/release/evorule-server
          retention-days: 7
          if-no-files-found: warn

  # ===== Docker image build (no push) =====
  build-docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: evorule-server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test (image can start)
        run: |
          docker run --rm -d -p 18080:18080 --name evorule-smoke \
            -e EVORULE_ADDR=127.0.0.1:18080 \
            evorule-server:ci-${{ github.sha }}
          sleep 5
          curl -sf http://127.0.0.1:18080/api/health || (docker logs evorule-smoke; exit 1)
          docker stop evorule-smoke || true
