name: Mirror from Gitee

# 生态统一镜像模板 v1 (2026-09-16): Gitee(主仓) → GitHub(镜像)。
# 定时(UTC 00:00 = 北京时间 08:00)将 Gitee 的全部分支与 tag 强制同步到 GitHub,
# 手动触发见 workflow_dispatch。
#
# 前置: 在 GitHub 仓库 Settings → Secrets and variables → Actions 配置
#   GITEE_TOKEN (Gitee 个人令牌, 勾选 repos + projects 权限) 用于鉴权推送。
#   注意: 下方 fetch 用匿名 https 只读拉取即可, 推送到 GitHub 用内置 GITHUB_TOKEN。
#
# 权限说明: contents:write 供镜像推送。
#   陷阱记录: permissions 不支持 `workflows` 键——本 workflow 曾以 job 级/
#   workflow 级声明 workflows:write, GitHub 解析器均判无效
#   ("Unexpected value 'workflows'", 2026-09-15 dispatch 实测), 表现为
#   schedule 触发失效 + 每次 push 产生零 job 失败 run (09-13~15 实测)。

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    name: Mirror branches and tags from Gitee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: 配置 Gitee remote (带鉴权)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then echo "ERROR: 缺 GITEE_TOKEN"; exit 1; fi
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/evorule/${{ github.event.repository.name }}.git" \
            || git remote set-url gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/evorule/${{ github.event.repository.name }}.git"

      - name: Fetch from Gitee
        run: |
          git fetch gitee --tags --prune --force

      # 容错逐 ref 推送: 单个 ref 被拒(如 ref 含 workflow 文件变更而
      # GITHUB_TOKEN 无 workflows 权限——GitHub 限制, 见上方陷阱记录)
      # 只记 warning 跳过, 不阻塞其余 ref 的镜像。
      - name: Mirror branches to GitHub (逐分支容错)
        run: |
          failed=0
          for branch in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/gitee/); do
            [ -z "$branch" ] && continue
            [ "$branch" = "HEAD" ] && continue
            if ! git push origin "refs/remotes/gitee/$branch:refs/heads/$branch" --force; then
              echo "::warning:: 分支 $branch 推送被拒, 跳过 (常见原因: 含 workflow 文件变更)"
              failed=$((failed+1))
            fi
          done
          echo "分支镜像完成: 失败 $failed 个"

      - name: Mirror tags to GitHub (逐 tag 容错)
        run: |
          failed=0
          for tag in $(git tag --list); do
            if ! git push origin "refs/tags/$tag" --force; then
              echo "::warning:: tag $tag 推送被拒, 跳过"
              failed=$((failed+1))
            fi
          done
          echo "tag 镜像完成: 失败 $failed 个"
