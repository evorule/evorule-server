# Release workflow for EvoRule Server
#
# 触发: 推送 v* tag
# 产物: 双平台零依赖分发包 (GitHub Release 附件)
#   - evorule-server-v{VER}-win64.zip    (server.exe + rule-serve.exe + web + rules + 启动脚本 + 中文说明)
#   - evorule-server-v{VER}-linux64.tar.gz (同构 linux 包)
#   - sha256-checks.txt + cosign .sig
# 注: 本仓不发 macOS 产物(定位 Windows 一键包 + Linux 服务)
# 注: 双包均内置 ai-plugin 分发件(plugins/ai-plugin/,缺省禁用:
#   evorule-ai-plugin 二进制 + plugin.json + config.example.json;凭据文件
#   ai-plugin.json 绝不入包;包内 plugin_manifest.json 预登记 enabled:false 条目)
#
# 设计说明:
# - 与 evorule 仓同构: github 是权威源/发布主入口, 承担双平台构建并直发
#   Release(幂等创建)
# - rule-serve.exe 来自 evorule-rule 独立发版 Release
#   (RULE_SERVE_VERSION 锁定配套版本), web 静态与业务场景规则来自
#   console-cloud 仓(CONSOLE_CLOUD_REF)现场构建, 两仓解耦
# - TLS 后端为 rustls, musl 静态构建无系统 OpenSSL 依赖
# - bat/说明模板在仓内 dist/ 目录(可审阅可版本化), 打包直拷
# - 发布原始二进制由 cosign keyless (OIDC) 签名, .sig 随 Release 发布, 见 SIGNING.md

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # cosign keyless 签名所需 OIDC token

env:
  CARGO_TERM_COLOR: always
  # 分发包内 rule-serve 二进制的配套版本(evorule-rule Release tag)。
  # 升级时改这一处;发布前用 sha256-checks.txt 校验下载完整性。
  RULE_SERVE_VERSION: v0.3.1
  # web 静态 + 业务场景规则来源(console-cloud 仓 ref)
  CONSOLE_CLOUD_REF: main

jobs:
  # ==========================================================================
  # 0. 发布门 pre-flight：tag commit 上全量测试 + 全链 e2e（红=fail-fast 不出产物）
  # ==========================================================================
  pre-flight:
    name: pre-flight tests (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install system deps (SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          key: preflight-${{ github.sha }}

      - name: workspace tests
        run: cargo test --workspace --exclude evorule-setup

      - name: full-chain e2e (gated 三件套)
        working-directory: evorule-server
        run: >
          cargo test --features full-chain-tests
          --test acceptance_full_chain
          --test binding_e2e
          --test q12_data_asset_e2e

  # ==========================================================================
  # 1. 双平台矩阵构建 (server 二进制)
  # ==========================================================================
  build:
    needs: [pre-flight]
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: evorule-server-linux-x86_64
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: evorule-server-windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - name: 门禁旁路断言 (EVORULE_SKIP_GATE 存在即 fail)
        shell: bash
        # 补偿检测: build.rs 跳过阀 fail-closed 化后, 若构建/发布机环境残留
        # 该变量(哪怕 =0), cargo build 时门禁静默跳过且无任何环节报警。
        # 存在即拒绝——值内容不回显, 防变量内容泄入日志。
        run: |
          [ -z "${EVORULE_SKIP_GATE+x}" ] || { echo "ERROR: EVORULE_SKIP_GATE 已设置(值不回显)——构建环境残留门禁旁路变量, 禁止构建/发布"; exit 1; }

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 安装 musl 工具链 (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 构建 server 二进制
        run: cargo build -p evorule-server --release --target ${{ matrix.target }} --bin evorule-server

      # ai-plugin 独立插件包(脱离 workspace),同 target 双平台编译;
      # 依赖 rustls(无 OpenSSL),musl 静态构建可行
      - name: 构建 ai-plugin 二进制
        run: cargo build --release --target ${{ matrix.target }} --manifest-path plugins/ai-plugin/Cargo.toml

      # sanity check 不做输出重定向: windows runner 默认 pwsh 不认 >/dev/null,
      # 且 --help 正常退出码为 0,输出到控制台无害(此处只为证明"编译过且能起")
      - name: binary sanity check (防"编译过但起不来"被当成成功)
        run: target/${{ matrix.target }}/release/evorule-server${{ matrix.ext }} --help

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/evorule-server${{ matrix.ext }}

      - name: 上传 ai-plugin 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-ai-plugin
          path: plugins/ai-plugin/target/${{ matrix.target }}/release/evorule-ai-plugin${{ matrix.ext }}

  # ==========================================================================
  # 2. 发布原始二进制 cosign keyless 签名 (OIDC, 无密钥管理)
  #    签名落库为 .sig, 随 Release 资产发布。验证见 SIGNING.md。
  # ==========================================================================
  sign:
    name: sign (cosign keyless)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Linux 构建产物
        uses: actions/download-artifact@v4
        with:
          name: evorule-server-linux-x86_64
          path: sign/linux

      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: evorule-server-windows-x86_64
          path: sign/windows

      - name: 安装 cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Keyless 签名 (OIDC)
        run: |
          mkdir -p sigout
          cosign sign-blob --yes \
            sign/linux/evorule-server \
            --output-signature sigout/evorule-server-linux-x86_64.sig
          cosign sign-blob --yes \
            sign/windows/evorule-server.exe \
            --output-signature sigout/evorule-server-windows-x86_64.exe.sig
          ls -la sigout

      - name: 上传签名产物
        uses: actions/upload-artifact@v4
        with:
          name: evorule-server-sigs
          path: sigout/

  # ==========================================================================
  # 3. 拉取配套资产 (方案 A 两仓解耦)
  #    a) rule-serve 双平台二进制 ← evorule-rule Release(RULE_SERVE_VERSION)
  #       用其 sha256-checks.txt 做完整性校验,再跑 --help sanity
  #    b) web 静态产物 ← console-cloud 镜像仓 vite build
  #    c) 业务场景规则 ← console-cloud assets/evorule-rules/
  # ==========================================================================
  fetch-assets:
    name: fetch-bundle-assets
    runs-on: ubuntu-latest
    steps:
      - name: 下载 rule-serve 双平台二进制 (evorule-rule ${{ env.RULE_SERVE_VERSION }})
        run: |
          mkdir -p rule-serve && cd rule-serve
          BASE="https://github.com/evorule/evorule-rule/releases/download/${{ env.RULE_SERVE_VERSION }}"
          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL \
            -o sha256-checks.txt "${BASE}/sha256-checks.txt"
          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL \
            -o evorule-rule-serve-linux-x86_64 "${BASE}/evorule-rule-serve-linux-x86_64"
          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL \
            -o evorule-rule-serve-windows-x86_64.exe "${BASE}/evorule-rule-serve-windows-x86_64.exe"
          # 完整性校验: 只取 rule-serve 两行做 sha256sum -c (cli 行无关本包)
          grep -E 'evorule-rule-serve-(linux-x86_64|windows-x86_64\.exe)$' sha256-checks.txt | sha256sum -c -
          chmod +x evorule-rule-serve-linux-x86_64

      - name: rule-serve sanity check
        run: ./rule-serve/evorule-rule-serve-linux-x86_64 --help

      - name: 检出 console-cloud 镜像
        run: |
          git clone --depth 1 --branch ${{ env.CONSOLE_CLOUD_REF }} \
            https://github.com/evorule/evorule-console-cloud.git console-cloud

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: console-cloud/package-lock.json

      - name: 构建 web 静态产物 (adapter-static)
        run: |
          cd console-cloud
          npm ci
          npm run build
          test -f build/index.html

      - name: 归集资产到单一根 (避免 artifact 相对路径歧义)
        run: |
          set -e
          mkdir -p assets-out/web assets-out/rules
          cp rule-serve/evorule-rule-serve-linux-x86_64 assets-out/
          cp rule-serve/evorule-rule-serve-windows-x86_64.exe assets-out/
          cp -r console-cloud/build/* assets-out/web/
          cp console-cloud/assets/evorule-rules/*.json assets-out/rules/
          ls -laR assets-out | head -40

      - name: 上传资产 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-assets
          path: assets-out/

  # ==========================================================================
  # 4. 组装双平台零依赖分发包
  #    win64: zip (含 start-evorule.bat)  linux64: tar.gz (含 start-evorule.sh)
  #    包结构对齐体验版 v0.2.0 形态 + 回归验证 更名(server_eval.json)
  # ==========================================================================
  bundle:
    name: bundle
    needs: [build, fetch-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 许可证合规 (AGPL §4): THIRD-PARTY-NOTICES.md + LICENSES/third-party/
      # 出自根仓声明面单一事实源, 钉 SHA 保可复现; LICENSE/NOTICE.md 用本仓自带
      - name: Checkout 根仓声明面 SSOT (钉 SHA)
        uses: actions/checkout@v4
        with:
          repository: evorule/evorule
          ref: 5560fe93c2443c1d985d21b534535b241333cffd
          path: lic-ssot
          persist-credentials: false

      # 源码提供入口 (AGPL §13): SOURCE.md 按本次发布动态生成 (指纹表填实值),
      # 源码 tarball 随 Release 附件分发, SHA256 记入 sha256-checks.txt
      - name: 生成 SOURCE.md 与源码 tarball (AGPL §13)
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          SRC_TGZ="evorule-server-${VER}-source.tar.gz"
          git archive --format=tar.gz --prefix="evorule-server-${VER}/" -o "${SRC_TGZ}" HEAD
          SRC_SHA=$(sha256sum "${SRC_TGZ}" | cut -d' ' -f1)
          cat > SOURCE.md <<'EOF'
          <!--
            Copyright 2026 EvoRule Project

            SPDX-License-Identifier: AGPL-3.0-or-later
          -->

          # EvoRule Server — 源码提供入口（AGPL-3.0 §13）

          本分发包对应 EvoRule Server v@@VER@@，以 AGPL-3.0-or-later 授权。本文件随包
          分发，用于定位并校验与该包对应的完整源码（AGPL-3.0 第 13 条）。

          | 字段 | 值 |
          |---|---|
          | 发布 tag | v@@VER@@ |
          | 源码仓库（权威源） | <https://github.com/evorule/evorule-server> |
          | 源码 tarball | `evorule-server-@@VER@@-source.tar.gz`（随本 Release 附件分发） |
          | 源码 tarball SHA256 | `@@SHA@@` |

          ## 获取与校验方式

          1. `git clone` 上表任一仓库，`git checkout v@@VER@@`
          2. 复现归档：`git archive --format=tar.gz --prefix=evorule-server-@@VER@@/ -o evorule-server-@@VER@@-source.tar.gz HEAD`
          3. 计算 SHA256 并与上表值比对（同一记录亦在随 Release 发布的 `sha256-checks.txt` 中）

          ## 第三方组件

          许可正文与归属声明见包内 `THIRD-PARTY-NOTICES.md` 与 `LICENSES/third-party/`
          （出自根仓声明面单一事实源，钉版 commit 5560fe93c2443c1d985d21b534535b241333cffd）。

          ## 内嵌组件

          - `evorule-rule-serve`（治理中心服务）：<https://github.com/evorule/evorule-rule>
          - `web/`（console 用户面板静态产物）：<https://github.com/evorule/evorule-console-cloud>
          EOF
          sed -i "s/@@VER@@/${VER}/g; s/@@SHA@@/${SRC_SHA}/g" SOURCE.md
          ls -la SOURCE.md "${SRC_TGZ}"

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 组装 win64 包
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          PKG="evorule-server-${VER}-win64"
          mkdir -p "${PKG}/resources"
          cp artifacts/evorule-server-windows-x86_64/evorule-server.exe "${PKG}/"
          cp artifacts/bundle-assets/evorule-rule-serve-windows-x86_64.exe "${PKG}/evorule-rule-serve.exe"
          cp -r artifacts/bundle-assets/web "${PKG}/web"
          mkdir -p "${PKG}/rules"
          cp artifacts/bundle-assets/rules/*.json "${PKG}/rules/"
          cp rules/10_role13_demo.json "${PKG}/rules/"
          cp resources/server_eval.json "${PKG}/resources/"
          cp service_registry.json "${PKG}/"
          # ai-plugin 分发件(批次A): 缺省禁用,启用引导见 README-STARTUP.txt;
          # 凭据文件 ai-plugin.json 绝不入包
          mkdir -p "${PKG}/plugins/ai-plugin"
          cp artifacts/evorule-server-windows-x86_64-ai-plugin/evorule-ai-plugin.exe "${PKG}/plugins/ai-plugin/"
          cp plugins/ai-plugin/plugin.json plugins/ai-plugin/config.example.json "${PKG}/plugins/ai-plugin/"
          # 包内自带插件清单(预登记 ai-plugin enabled:false): dist/ 的开发机清单引用
          # 包外 finance-config, 不可入包; server 对 --plugins 清单缺失 fail-fast,
          # 缺此文件会导致主服务在干净机器上拒启
          printf '{ "plugins": { "ai-plugin": { "enabled": false, "manifest": "plugins/ai-plugin/plugin.json" } } }\n' > "${PKG}/plugin_manifest.json"
          # bat 模板按 .gitattributes 钉 CRLF 检出,直拷即兼容记事本/cmd
          cp dist/start-evorule.bat "${PKG}/"
          cp dist/README-STARTUP.txt "${PKG}/"
          # deployment-side plugin watchdog (optional; windows package only)
          # 批次E: plugins-watchdog.json 已出库（部署侧或含真实 token
          # env，防误提交）——CI 优先本地文件，缺失则由 example 模板生成
          cp dist/start-watchdog.bat "${PKG}/"
          cp dist/watchdog-plugins.ps1 "${PKG}/"
          if [ -f dist/plugins-watchdog.json ]; then
            cp dist/plugins-watchdog.json "${PKG}/"
          else
            cp dist/plugins-watchdog.example.json "${PKG}/plugins-watchdog.json"
          fi
          # 许可证合规五件套 (AGPL §4): 随包附带许可正文、第三方声明与源码入口
          cp LICENSE NOTICE.md "${PKG}/"
          cp lic-ssot/THIRD-PARTY-NOTICES.md "${PKG}/"
          mkdir -p "${PKG}/LICENSES"
          cp -r lic-ssot/LICENSES/third-party "${PKG}/LICENSES/third-party"
          cp SOURCE.md "${PKG}/"
          # 包内完整性清单
          cd "${PKG}"
          sha256sum evorule-server.exe evorule-rule-serve plugins/ai-plugin/evorule-ai-plugin > sha256-checks.txt
          cd ..
          zip -qr "${PKG}.zip" "${PKG}"
          ls -la "${PKG}.zip"

      - name: 组装 linux64 包
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          PKG="evorule-server-${VER}-linux64"
          mkdir -p "${PKG}/resources"
          cp artifacts/evorule-server-linux-x86_64/evorule-server "${PKG}/"
          cp artifacts/bundle-assets/evorule-rule-serve-linux-x86_64 "${PKG}/evorule-rule-serve"
          chmod +x "${PKG}/evorule-server" "${PKG}/evorule-rule-serve"
          cp -r artifacts/bundle-assets/web "${PKG}/web"
          mkdir -p "${PKG}/rules"
          cp artifacts/bundle-assets/rules/*.json "${PKG}/rules/"
          cp rules/10_role13_demo.json "${PKG}/rules/"
          cp resources/server_eval.json "${PKG}/resources/"
          cp service_registry.json "${PKG}/"
          # ai-plugin 分发件(批次A, musl 静态二进制): 同 win64 语义
          mkdir -p "${PKG}/plugins/ai-plugin"
          cp artifacts/evorule-server-linux-x86_64-ai-plugin/evorule-ai-plugin "${PKG}/plugins/ai-plugin/"
          chmod +x "${PKG}/plugins/ai-plugin/evorule-ai-plugin"
          cp plugins/ai-plugin/plugin.json plugins/ai-plugin/config.example.json "${PKG}/plugins/ai-plugin/"
          # 同 win64: 包内自带预登记插件清单(server 对 --plugins 清单缺失 fail-fast)
          printf '{ "plugins": { "ai-plugin": { "enabled": false, "manifest": "plugins/ai-plugin/plugin.json" } } }\n' > "${PKG}/plugin_manifest.json"
          cp dist/start-evorule.sh "${PKG}/"
          cp dist/README-STARTUP.txt "${PKG}/"
          # 回归验证 补遗I(遗留L1): linux 包同 win64 语义携带可选插件看门狗
          # (python3 实现);配置已出库,缺省由 example 模板生成
          cp dist/start-watchdog.sh dist/watchdog-plugins.py "${PKG}/"
          chmod +x "${PKG}/start-watchdog.sh"
          if [ -f dist/plugins-watchdog.json ]; then
            cp dist/plugins-watchdog.json "${PKG}/"
          else
            cp dist/plugins-watchdog.example.json "${PKG}/plugins-watchdog.json"
          fi
          # 许可证合规五件套 (AGPL §4): 同 win64 语义
          cp LICENSE NOTICE.md "${PKG}/"
          cp lic-ssot/THIRD-PARTY-NOTICES.md "${PKG}/"
          mkdir -p "${PKG}/LICENSES"
          cp -r lic-ssot/LICENSES/third-party "${PKG}/LICENSES/third-party"
          cp SOURCE.md "${PKG}/"
          cd "${PKG}"
          sha256sum evorule-server evorule-rule-serve plugins/ai-plugin/evorule-ai-plugin > sha256-checks.txt
          cd ..
          tar -czf "${PKG}.tar.gz" "${PKG}"
          ls -la "${PKG}.tar.gz"

      # 汇总清单: 两个包文件自身的 sha256(供下载方校验包完整性)
      - name: 生成包级 sha256 清单
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd .
          sha256sum "evorule-server-${VER}-win64.zip" "evorule-server-${VER}-linux64.tar.gz" "evorule-server-${VER}-source.tar.gz" > sha256-checks.txt
          cat sha256-checks.txt

      - name: 上传分发包 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: |
            evorule-server-*-win64.zip
            evorule-server-*-linux64.tar.gz
            evorule-server-*-source.tar.gz
            sha256-checks.txt

  # ==========================================================================
  # 5. GitHub Release
  # ==========================================================================
  release:
    name: release
    needs: [dist-gate, bundle, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载分发包
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: release-assets

      - name: 下载签名
        uses: actions/download-artifact@v4
        with:
          name: evorule-server-sigs
          path: release-sigs

      - name: 创建 Release 并附加分发包
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/evorule-server-*-win64.zip
            release-assets/evorule-server-*-linux64.tar.gz
            release-assets/evorule-server-*-source.tar.gz
            release-assets/sha256-checks.txt
            release-sigs/evorule-server-linux-x86_64.sig
            release-sigs/evorule-server-windows-x86_64.exe.sig
          body: |
            EvoRule Server ${{ github.ref_name }} 零依赖分发包。

            - `evorule-server-*-win64.zip` — Windows 10/11 64 位:解压后双击 start-evorule.bat
            - `evorule-server-*-linux64.tar.gz` — Linux x86_64:解压后运行 start-evorule.sh
            - `sha256-checks.txt` — 分发包完整性校验
            - `evorule-server-*-source.tar.gz` — 源码 tarball (AGPL §13), 指纹见包内 SOURCE.md 与 sha256-checks.txt
            - `evorule-server-*.sig` — 发布原始二进制 cosign keyless 签名, 验证见 SIGNING.md

            无需 Node/Rust/数据库;中文说明见包内 README-STARTUP.txt。
            rule-serve 治理服务二进制来自 [evorule-rule](${{ env.RULE_SERVE_VERSION }} 配套版本)。
            包内已内置 AI 插件(plugins/ai-plugin/,缺省禁用;启用三步见 README-STARTUP.txt)。
          generate_release_notes: true

  dist-gate:
