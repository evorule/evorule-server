[workspace]
resolver = "2"
members = [
    "core/auth",
    "core/debug_control",
    "core/hot_reload",
    "core/io_handlers",
    "core/metrics",
    "core/plugin-kit",
    "core/rule_loader",
    "core/rule_schema",
    "core/rule_tools",
    "core/semantic_invariants",
    "core/time_machine",
    "core/workspace",
    "evorule-server",
    "installer",
    "plugins/demo-services",
    "plugins/physics-services",
    "plugins/indicator-services",
    "plugins/template-services",
    "plugins/browser-services",
    "plugins/inference-services",
    "plugins/geometry-services",
    "plugins/numeric-services",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
repository = "https://gitee.com/evorule/evorule-server"
homepage = "https://gitee.com/evorule/evorule-server"
rust-version = "1.74"


[workspace.lints.rust]
# kani cfg 由 kani 工具链注入, Cargo 不识别, 显式声明以抑制 warning
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# G1: panic-prone
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
# F8: 嵌套复杂度
cognitive_complexity = { level = "warn", priority = -1 }
# F9: 函数长度
too_many_lines = { level = "warn", priority = -1 }
# F10 部分: 类型复杂度
type_complexity = { level = "warn", priority = -1 }
# F6 部分: 模块导入图
module_inception = "warn"
# 通用代码质量
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# [patch.crates-io] 过渡段已于 0.9.0 退役：主仓 0.8.0 五包（tcb/reactor/
# governance/discipline/cli）已发布 crates.io，核心依赖为纯 version。
# （历史：0.6.1 registry 与过渡 git 源曾因双实例类型冲突需 patch 共实例；
#  0.7 线治理侧 API 未上 registry 期间 evorule-governance 一并入 patch。）

# [patch.crates-io] 重引（干预端点批）：evorule-reactor vendored 补丁——
# 三个干预原语（check_invariants 提 pub / WalWriter::rotate 提 pub +
# FactsLog 透传 / cancel_all_pending 新原语+快照 pending 清单+不变式扫描槽）
# 未经主仓发版前，以仓内 patches/evorule-reactor 路径补丁先行（[patch] 全局
# 替换注册表实例，无双实例类型冲突；0.6.1/0.7 线同机制先例）。
# 删除条件：主仓发布 ≥0.8.5 且含同形 API → 删本段+patches/ 目录，依赖回
# 纯 version，cargo update 验证一致（补丁差异面见 patches/evorule-reactor/README-PATCH.md）。
# [patch.crates-io] 重引（安全路由与网关 SG-2 批）：evorule-governance vendored 补丁——
# 路由策略资产化（RoutePolicy 三元决策表 + PermissionGate::with_route_policy/check_routed
# + IoSubscriber deny 回写 route 语义留痕）。未经主仓发版前，以仓内
# patches/evorule-governance 路径补丁先行（与 evorule-reactor 同机制先例）。
# 删除条件：主仓发布 ≥0.8.6 且含同形 API → 删本段+patches/evorule-governance，
# 依赖回纯 version，cargo update 验证一致（补丁差异面见 patches/evorule-governance/README-PATCH.md）。
# [patch.crates-io] 重引（白名单 in 域 design-19 批）：evorule-tcb vendored 补丁——
# in 域类型（集合成员判定，多模型准入白名单 DSL 表达面）。未经主仓发版前，以仓内
# patches/evorule-tcb 路径补丁先行（与 evorule-reactor/evorule-governance 同机制先例）。
# 删除条件：主仓发布含同形 in 域 API → 删本行+patches/evorule-tcb，依赖回纯
# version，cargo update 验证一致（补丁差异面见 patches/evorule-tcb/README-PATCH.md）。
[patch.crates-io]
evorule-reactor = { path = "patches/evorule-reactor" }
evorule-governance = { path = "patches/evorule-governance" }
evorule-tcb = { path = "patches/evorule-tcb" }
