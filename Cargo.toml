[workspace]
resolver = "2"
members = [
    "core/auth",
    "core/debug_control",
    "core/governance-host",
    "core/hot_reload",
    "core/io_handlers",
    "core/metrics",
    "core/plugin-kit",
    "core/rule_loader",
    "core/rule_schema",
    "core/rule_tools",
    "core/semantic_invariants",
    "core/time_machine",
    "core/workspace",
    "evorule-server",
    "installer",
    "plugins/demo-services",
    "plugins/physics-services",
    "plugins/indicator-services",
    "plugins/template-services",
    "plugins/browser-services",
    "plugins/inference-services",
    "plugins/geometry-services",
    "plugins/numeric-services",
    "plugins/mechanics-services",
    "plugins/gnss-services",
    "plugins/grav-services",
    "plugins/checksum-services",
    "plugins/cny-services",
    "plugins/fluid-services",
    "plugins/quantum-services",
    "plugins/metrology-services",
    "plugins/gov-services",
    "plugins/legal-services",
    "plugins/export-services",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
repository = "https://gitee.com/evorule/evorule-server"
homepage = "https://gitee.com/evorule/evorule-server"
rust-version = "1.74"


[workspace.lints.rust]
# kani cfg 由 kani 工具链注入, Cargo 不识别, 显式声明以抑制 warning
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# G1: panic-prone
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
# F8: 嵌套复杂度
cognitive_complexity = { level = "warn", priority = -1 }
# F9: 函数长度
too_many_lines = { level = "warn", priority = -1 }
# F10 部分: 类型复杂度
type_complexity = { level = "warn", priority = -1 }
# F6 部分: 模块导入图
module_inception = "warn"
# 通用代码质量
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# [patch.crates-io] 过渡段已于 0.9.0 退役：主仓 0.8.0 五包（tcb/reactor/
# governance/discipline/cli）已发布 crates.io，核心依赖为纯 version。
# （历史：0.6.1 registry 与过渡 git 源曾因双实例类型冲突需 patch 共实例；
#  0.7 线治理侧 API 未上 registry 期间 evorule-governance 一并入 patch。）

# [patch.crates-io] 在役（干预端点批）：evorule-reactor vendored 补丁——
# 三个干预原语（check_invariants 提 pub / WalWriter::rotate 提 pub +
# FactsLog 透传 / cancel_all_pending 新原语+快照 pending 清单+不变式扫描槽）
# 主仓 0.10.0 未含同形 API，以仓内 patches/evorule-reactor 路径补丁先行
# （[patch] 全局替换注册表实例，无双实例类型冲突；0.6.1/0.7 线同机制先例）。
# 2026-10-28 换基重铸：副本以主仓 0.10.0 逐文件为基线重施独有面，版本号
# 声明 0.10.0（否则 governance 0.10 依赖 reactor ^0.10 时旧 0.8.4 基线解析
# 必炸）。差异面见 patches/evorule-reactor/README-PATCH.md。
# 删除条件：主仓发布含同形 API → 删本段+patches/ 目录，依赖回纯 version，
# cargo update 验证一致。
# [patch.crates-io] 在役（白名单 in 域批）：evorule-tcb vendored 补丁——
# in 域类型（集合成员判定，多模型准入白名单 DSL 表达面）。主仓 0.10.0 未含
# in 域，以仓内 patches/evorule-tcb 路径补丁先行（与 evorule-reactor 同机制
# 先例）。2026-10-28 换基重铸同上（版本声明 0.10.0）。
# 差异面见 patches/evorule-tcb/README-PATCH.md。
# 删除条件：主仓发布含同形 in 域 API → 删本行+patches/evorule-tcb，依赖回纯
# version，cargo update 验证一致。
# evorule-governance vendored 补丁已于 0.10.0 退役（治理 vendored patch 退役
# 架构手术批）：session/auditor 服务端 fork 收编为原生 crate
# core/governance-host（evorule-governance-host，含 rehydrate/G6 规则集锚定/
# EVID 导出面），server 依赖回 registry 纯 version 0.10。历史副本
# patches/evorule-governance 暂留参照，后续清理批删除。
[patch.crates-io]
evorule-reactor = { path = "patches/evorule-reactor" }
