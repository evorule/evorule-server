[workspace]
resolver = "2"
members = [
    "core/auth",
    "core/debug_control",
    "core/hot_reload",
    "core/io_handlers",
    "core/metrics",
    "core/plugin-kit",
    "core/rule_schema",
    "core/rule_tools",
    "core/semantic_invariants",
    "core/time_machine",
    "core/workspace",
    "evorule-server",
    "installer",
    "plugins/demo-services",
    "plugins/physics-services",
    "plugins/indicator-services",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
repository = "https://gitee.com/evorule/evorule-server"
homepage = "https://gitee.com/evorule/evorule-server"
rust-version = "1.74"


[workspace.lints.rust]
# kani cfg 由 kani 工具链注入, Cargo 不识别, 显式声明以抑制 warning
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# G1: panic-prone
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
# F8: 嵌套复杂度
cognitive_complexity = { level = "warn", priority = -1 }
# F9: 函数长度
too_many_lines = { level = "warn", priority = -1 }
# F10 部分: 类型复杂度
type_complexity = { level = "warn", priority = -1 }
# F6 部分: 模块导入图
module_inception = "warn"
# 通用代码质量
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# R11 过渡 patch：mark_as_rollup 返回 RollupOutcome 的新 API 尚未发布
# crates.io（governance 0.6.1 未发），CI 从主仓 git 拉含新 API 的版本。
# 三件套整体 patch（governance 的 git workspace 会连带 reactor，单 patch
# governance 会造成 reactor 双版本类型冲突）；本地 .cargo/config.toml
# （gitignore）的 path patch 已同步移除，本地与 CI 同构。发版后删除本段。
[patch.crates-io]
evorule-governance = { git = "https://gitee.com/evorule/evorule.git" }
evorule-reactor = { git = "https://gitee.com/evorule/evorule.git" }
evorule-tcb = { git = "https://gitee.com/evorule/evorule.git" }
