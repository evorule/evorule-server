[workspace]
resolver = "2"
members = [
    "core/auth",
    "core/debug_control",
    "core/hot_reload",
    "core/io_handlers",
    "core/metrics",
    "core/rule_schema",
    "core/rule_tools",
    "core/semantic_invariants",
    "core/time_machine",
    "core/workspace",
    "evorule-server",
    "plugins/demo-services",
    "plugins/physics-services",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
repository = "https://gitee.com/evorule/evorule-server"
homepage = "https://gitee.com/evorule/evorule-server"
rust-version = "1.74"

# AUDIT-A1 修复验证用：临时将 governance/reactor 指向本地工作副本
# （WalUnavailable 变体尚未随新版本发布，发布审批后移除此段）
[patch.crates-io]
evorule-governance = { path = "../evorule/evorule-governance" }
evorule-reactor = { path = "../evorule/evorule-reactor" }
evorule-tcb = { path = "../evorule/evorule-tcb" }
# SSOT 对称化(审计⑤ S2)：bundle 校验逻辑与治理侧(evorule-rule)同吃本地源,
# 消除"治理侧本地改动未发版 → 两侧校验口径分裂"的通道
evorule-bundle = { path = "../evorule-bundle" }
evorule-hash = { path = "../evorule-hash" }


[workspace.lints.rust]
# kani cfg 由 kani 工具链注入, Cargo 不识别, 显式声明以抑制 warning
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# G1: panic-prone
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
# F8: 嵌套复杂度
cognitive_complexity = { level = "warn", priority = -1 }
# F9: 函数长度
too_many_lines = { level = "warn", priority = -1 }
# F10 部分: 类型复杂度
type_complexity = { level = "warn", priority = -1 }
# F6 部分: 模块导入图
module_inception = "warn"
# 通用代码质量
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
