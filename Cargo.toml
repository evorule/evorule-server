[workspace]
resolver = "2"
members = [
    "core/auth",
    "core/debug_control",
    "core/hot_reload",
    "core/io_handlers",
    "core/metrics",
    "core/plugin-kit",
    "core/rule_schema",
    "core/rule_tools",
    "core/semantic_invariants",
    "core/time_machine",
    "core/workspace",
    "evorule-server",
    "installer",
    "plugins/demo-services",
    "plugins/physics-services",
    "plugins/indicator-services",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
repository = "https://gitee.com/evorule/evorule-server"
homepage = "https://gitee.com/evorule/evorule-server"
rust-version = "1.74"


[workspace.lints.rust]
# kani cfg 由 kani 工具链注入, Cargo 不识别, 显式声明以抑制 warning
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# G1: panic-prone
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
# F8: 嵌套复杂度
cognitive_complexity = { level = "warn", priority = -1 }
# F9: 函数长度
too_many_lines = { level = "warn", priority = -1 }
# F10 部分: 类型复杂度
type_complexity = { level = "warn", priority = -1 }
# F6 部分: 模块导入图
module_inception = "warn"
# 通用代码质量
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# 本机联调补丁（纪律门禁接线）：evorule-discipline 以 path 依赖同机 evorule 仓，
# 若不把 evorule-tcb 一并指向本地，registry 0.6.1 与 path 0.6.1 会成为两个 crate
# 实例，JsonValue 跨 crate 传参报 E0308 类型不匹配。
# 发布前必做（同发同装）：①发 evorule-discipline 0.6.1 到 crates.io；
# ②删除本 [patch] 段；③evorule-server/Cargo.toml 的 evorule-discipline 依赖切纯 version。
[patch.crates-io]
evorule-tcb = { path = "../evorule/evorule-tcb" }
