[workspace]
resolver = "2"
members = [
    "core/auth",
    "core/governance-host",
    "core/io_handlers",
    "core/plugin-kit",
    "core/rule_loader",
    "core/rule_schema",
    "core/rule_tools",
    "core/workspace",
    "evorule-server",
    "installer",
    "plugins/demo-services",
    "plugins/physics-services",
    "plugins/indicator-services",
    "plugins/template-services",
    "plugins/browser-services",
    "plugins/inference-services",
    "plugins/geometry-services",
    "plugins/numeric-services",
    "plugins/mechanics-services",
    "plugins/gnss-services",
    "plugins/grav-services",
    "plugins/checksum-services",
    "plugins/cny-services",
    "plugins/fluid-services",
    "plugins/quantum-services",
    "plugins/metrology-services",
    "plugins/gov-services",
    "plugins/legal-services",
    "plugins/export-services",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
repository = "https://gitee.com/evorule/evorule-server"
homepage = "https://gitee.com/evorule/evorule-server"
rust-version = "1.74"


[workspace.lints.rust]
# kani cfg 由 kani 工具链注入, Cargo 不识别, 显式声明以抑制 warning
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# G1: panic-prone
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
# F8: 嵌套复杂度
cognitive_complexity = { level = "warn", priority = -1 }
# F9: 函数长度
too_many_lines = { level = "warn", priority = -1 }
# F10 部分: 类型复杂度
type_complexity = { level = "warn", priority = -1 }
# F6 部分: 模块导入图
module_inception = "warn"
# 通用代码质量
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# [patch.crates-io] 过渡段已于 0.9.0 退役：主仓 0.8.0 五包（tcb/reactor/
# governance/discipline/cli）已发布 crates.io，核心依赖为纯 version。
# （历史：0.6.1 registry 与过渡 git 源曾因双实例类型冲突需 patch 共实例；
#  0.7 线治理侧 API 未上 registry 期间 evorule-governance 一并入 patch。）

# [patch.crates-io] 历史（全部已退役）：① evorule-tcb（白名单 in 域批）——
# 主仓 v0.11.0 收编 in 域后按其删除条件退役（2026-10-31），内核消费走注册表；
# ② evorule-reactor（干预端点批）——主仓 v0.12.0 收编干预原语三件
# （cancel_all_pending/pending 快照/不变式扫描报告+check_invariants 提 pub）
# 后按其删除条件退役（2026-10-31）；③ evorule-governance——v0.10.0 收编为
# 原生 crate core/governance-host（rehydrate/G6 规则集锚定/EVID 导出面），
# 历史参照副本 patches/evorule-governance 随 parity review 签字于同日删除。
# 自此本仓对主仓内核五包全部为注册表纯 version 消费，零 vendored 补丁。
