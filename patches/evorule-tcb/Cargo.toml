[package]
name = "evorule-tcb"
# vendored patch 基线 v0.10.0（主仓 2026-10-28 换基重铸）；差异面与删除条件见 README-PATCH.md
version = "0.10.0"
edition = "2021"
authors = ["EvoRule Project"]
license = "AGPL-3.0-or-later"
description = "EvoRule TCB Core - 纯计算内核，零依赖，确定性状态转换"
repository = "https://gitee.com/evorule/evorule"
homepage = "https://gitee.com/evorule/evorule"
documentation = "https://docs.rs/evorule-tcb"
keywords = ["tcb", "deterministic", "state-machine", "no-std"]
categories = ["no-std", "data-structures"]
# 发布到 crates.io 时排除开发产物/验证脚本（下游依赖消费者不需要）
# 与 evorule-reactor / evorule-governance 风格对齐
exclude = [
    "verification/",          # Kani 形式化验证 + 差分测试源码 (dev-only)
    "benches/",               # Criterion 性能基准源码 (dev-only)
    "scripts/",               # Kani 验证脚本 (dev-only)
    "rust-toolchain.toml",    # 开发工具链固定
    "**/*.log",               # 各类运行日志
    "install_log.txt",        # 工具安装日志
]

[dependencies]
# 无外部依赖（#![no_std] 兼容）
# alloc 由 Rust 标准库提供

[dev-dependencies]
# 确定性属性测试：随机输入下验证「相同输入 → 相同输出」
# 仅 dev 依赖，不进入发布产物（与零依赖核心隔离）
proptest = "1.4"
# 性能基准测试
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["std"]
# std 特性：启用标准库支持（用于测试和错误处理）
std = []

[[bench]]
name = "tcb_core"
harness = false

# 空 [workspace] 表：显式脱离 server 工作区（经根 [patch.crates-io] 以路径补丁
# 替换注册表实例；不入 members——补丁自带 dev-deps/tests，须在本目录独立测试）
[workspace]
