[package]
name = "evorule-reactor"
# vendored patch 基线 v0.10.0（主仓 2026-10-28 换基重铸）；差异面与删除条件见 README-PATCH.md
version = "0.10.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
repository = "https://gitee.com/evorule/evorule"
homepage = "https://gitee.com/evorule/evorule"
rust-version = "1.74"
description = "Reactive fact-driven state transition engine with audit chain, time machine, and WAL"
# readme 字段已随上游 crate README 移出公开仓（2026-10-13 公开面清洗批，正本见 knowledge 归档）
documentation = "https://docs.rs/evorule-reactor"
keywords = ["reactive", "audit", "rules-engine", "wal", "time-machine"]
categories = ["asynchronous", "data-structures", "concurrency"]
# 发布到 crates.io 时排除开发产物/验证脚本（下游依赖消费者不需要）
exclude = [
    "collect_kani_artifacts.sh", # Kani 验证产物收集脚本
    "run_kani_proofs.sh",        # Kani 验证运行脚本
    "**/hash_snapshot.txt",      # 哈希快照（开发产物）
    "docs/",                     # KANI 验证文档
    "verification/",             # Kani 证明 + 差分测试源码（下游不需要）
    "benches/",                  # Criterion 性能基准源码（dev-only）
    "include/",                  # C FFI 头文件（嵌入式用户可按需自取，默认不打包）
    "tests/build_ffi.ps1",       # C FFI 构建脚本（PowerShell）
    "tests/test_evorule.c",      # C FFI 集成测试源码
    "hash_snapshots/",           # 哈希快照目录
    "proptest-regressions/",     # proptest 回归测试用例缓存
    "rust-toolchain.toml",       # 开发工具链固定
    "**/*.log",                  # 各类运行日志
    "install_log.txt",           # 工具安装日志
]


[dependencies]
evorule-tcb = { version = "0.10.0" }
# SC3-a 方案乙：主仓 0.10.0 的 fact.rs/hash.rs 是 audit-chain 薄转发层，
# 本 vendored 基线随迁（audit-chain 0.10.0 已发布注册表，直接 version 解析）
evorule-audit-chain = { version = "0.10.0" }
tracing = "0.1"
serde_json = "1.0" # P0-1: WAL 持久化序列化（Fact ↔ JSON）
# 审计链哈希（两套 WAL 合并：哈希链提升到 tier1）
# 纯 Rust 实现，支持 musl 静态链接
blake3 = "1"

# H5: IoHandler trait object-safety —— 支持 Arc<dyn IoHandler> 动态分发
# 零成本宏,运行时仅一次 Box<dyn Future> 分配
async-trait = "0.1"

# WASM 适配：tokio 按编译目标分块——wasm32 不支持 rt-multi-thread
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }

# wasm32 块（2026-09-14 复核更正，TB-WASM-004）：
# - `time` 必须保留，不是可裁剪项。生产代码 src/reactor.rs 主循环 `Reactor::run`
#   中使用 `tokio::time::timeout(self.io_timeout_check_interval, cmd_rx.recv())`，
#   该调用点无 wasm32 门控，移除 feature 会在 wasm32 直接编译失败：
#     error[E0433]: cannot find `time` in `tokio`
#   （实测命令：删掉 "time" 后跑
#    `cargo build -p evorule-reactor --target wasm32-unknown-unknown --release`）
# - 保留 `time` 只是"让不可达路径能编过"，不代表它在 wasm32 可用：
#   time driver 依赖 `std::time::Instant`，而 wasm32-unknown-unknown 未实现该 API，
#   故任何 wasm32 下**真正可达**的 tokio 计时调用都会在运行时 panic。
#   当前 wasm32 唯一入口 evorule-wasm-demo 走纯同步子集，不构造 runtime，不触碰计时 API。
# - 纪律：新增 wasm32 可达代码不得使用 tokio::time / tokio::runtime；否则必须先把该路径
#   改为不依赖计时的实现（或推动 设计文档 §九 方案 B「Runtime trait 抽象」）。
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.0", features = ["sync", "rt", "time", "macros"] }

[lib]
crate-type = ["lib", "cdylib"]

[features]
# 阶段7：Kani 形式化验证
#
# 实际门控用 `#[cfg(kani)]`（由 `cargo kani` 自动注入 `--cfg kani`），
# 与 evorule-tcb/verification/kani_proofs.rs 风格一致，无需 --features kani。
# 此 feature 保留作向后兼容标记，启用后对 proof 编译无影响
# （proof 在 cfg(kani) 下，普通 cargo build 不编译）。
#
# 运行验证：
#   cargo kani -p evorule-reactor
#   cargo kani -p evorule-reactor --harness invariant_version_monotonic
kani = []
# 阶段9：C FFI 接口
#
# 启用后编译生成动态链接库，暴露 C API 供外部语言调用。
# 使用 `cargo build --features ffi --release` 构建。
ffi = []
# WAL 持久化
#
# 启用后编译 WAL 模块，支持磁盘持久化 FactsLog。
# 嵌入式/机器人场景可禁用以减小二进制体积。
# 使用 `cargo build --features persistence` 构建。
persistence = []

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
# 形式化验证:proptest 属性测试 + 差分测试(位于 verification/ 目录)
proptest = "1.4"
# 性能基准(criterion) — 041 v2.0 A7: reactor 主循环 + FactsLog append 基线
# 仅 dev 依赖,不进入 release 产物。benches/ 是 Rust 官方位置。
criterion = { version = "0.5", features = ["html_reports"] }

# 041 v2.0 A7: reactor 端到端主循环基准(spawn → 命令 → Stable → 退出)
[[bench]]
name = "reactor_e2e"
path = "benches/reactor_e2e.rs"
harness = false

# 041 v2.0 A7: FactsLog append 吞吐基准(内存模式,含哈希链计算)
[[bench]]
name = "facts_log_append"
path = "benches/facts_log_append.rs"
harness = false

[[example]]
name = "generate_hashed_wal"
required-features = ["persistence"]

# 形式化验证相关测试目标(位于 verification/ 目录,非默认 tests/ 目录)
# differential_test: P0-12 差分测试(reactor 运行时 vs execute_transition 纯函数)
[[test]]
name = "differential_test"
path = "verification/differential_test.rs"

# Fact 稳定序列化黄金向量自证闸门（副本侧棘轮；对向闸门在
# evorule-integration-tests）。断言面仅哈希契约（fact_to_stable_json /
# fact_hash，lib 导出无 feature 门控），常规 `cargo test` 即可运行，无需
# --features persistence；WAL 展示面不属对账物（详见测试文件头注释）。
[[test]]
name = "ssot_fact_contract_gate"

# 独立测试态 tcb 源重定向：本目录自测（空 workspace 表 + 独立 lock）下
# `evorule-tcb` 按纯 version req "0.10.0" 解析注册表 0.10.0 亦可编译（reactor
# 自测不触 in 域——in 域在 tcb dispatch 层，reactor 不消费）；但为与根仓消费
# 形态对齐（根仓 [patch.crates-io] 同时重定向 tcb 到 ../evorule-tcb 副本），
# 独立自测态同样指向仓内 vendored 副本，保证自测所见 = 根仓运行所见。
# 被根仓 [patch.crates-io] 以本目录为补丁源消费时本节不生效（patch 不嵌套）。
[patch.crates-io]
evorule-tcb = { path = "../evorule-tcb" }

[package.metadata.kani]
# CI 验证列表 (仅限能在 CI 预算内稳定通过的 proof; 与 .github/workflows/kani.yml
# 的 kani-reactor job 保持同步)
#
# 历史实测 (Kani 0.67.0, WSL Ubuntu 22.04, 2026-08-05): 10/11 PASS, 1/11 TIMEOUT
# v0.5.0 基线重跑 (2026-09-12): version_monotonic/max_rounds PASS (~10s / ~3s)
# P0-11/P1-5 2026-09-12 修复超时根因后入闸 (本地实测 1.53s / 0.57s PASS;
#   根因与修复见 verification/STATUS.md; P0-11 不带 --default-unwind 4 —
#   该配置实测对本 proof 无效; P1-5 带 unwind 4 实测通过)
#
# 其余 7 个 proof 未入 CI: 前 8 个涉及堆分配数据结构 (Vec/VecDeque/BTreeSet)
# 跨 Kani 版本可能不稳定, 为保证 CI 可靠性未列入 (历史实测 2026-08-05):
#   - invariant_io_count_register_complete   (PASS 36s,  涉及 BTreeSet)
#   - invariant_io_count_force_remove        (TIMEOUT 609s, BTreeSet force_remove 状态爆炸)
#   - invariant_io_recovery_iff_result       (PASS 45s,  涉及 Vec 操作)
#   - command_does_not_decrease_queue        (PASS 23s,  涉及 VecDeque)
#   - proof_fact_log_append_monotonic        (PASS 56s,  涉及 Vec + 哈希链)
#   - proof_hash_chain_back_link             (PASS 115s, 涉及哈希链)
#   - proof_reactor_invariants_preserved_after_pure_ops (PASS 16s, 组合操作)
#   - proof_phase_state_machine_cannot_jump  (PASS 7s,   Phase 状态机)
#
# 详见 verification/README.md (验证资产登记) 与 docs/KANI.md
proofs = [
    "invariant_cause_queue_sync",  # cause 队列同步 (P0-11, 2026-09-12 修复重入)
    "command_does_not_decrease_queue", # apply_command 队列不减 (P1-5, 2026-09-12 修复入闸)
    "invariant_version_monotonic", # version 单调递增 (简单计数器)
    "max_rounds_termination",      # max_rounds 终止条件 (简单有界循环)
]

# 空 [workspace] 表：显式脱离 server 工作区（经根 [patch.crates-io] 以路径补丁
# 替换注册表实例；不入 members——补丁自带 dev-deps/tests，须在本目录独立测试）
[workspace]
