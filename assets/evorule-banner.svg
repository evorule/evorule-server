<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="EvoRule — deterministic-first reactive rule execution engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1b2e"/>
      <stop offset="1" stop-color="#13243f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#F0D27A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- brand mark: EvoRule logo-primary (gold ring + two equal-sign bars), viewBox 960x960 scaled to ~156px -->
  <g transform="translate(33,75) scale(0.1773)" aria-label="EvoRule logo">
    <circle cx="480" cy="480" r="440" fill="none" stroke="#D4AF37" stroke-width="18"/>
    <rect x="180" y="310" width="600" height="80" rx="8" fill="#D4AF37"/>
    <rect x="180" y="570" width="600" height="80" rx="8" fill="#D4AF37"/>
  </g>

  <!-- wordmark -->
  <text x="224" y="150" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="80" font-weight="700" letter-spacing="0.5" fill="#e6edf3">Evo<tspan fill="url(#gold)">Rule</tspan></text>
  <text x="226" y="198" font-family="'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="24" fill="#9aa7b8">A deterministic-first reactive rule execution engine</text>
  <text x="226" y="238" font-family="'SF Mono', 'Consolas', monospace" font-size="18" fill="#c9a84a">append-only JSONL · BLAKE3 hash chain · forbid(unsafe_code) · no_std TCB</text>

  <!-- hash-chain motif (right) -->
  <g transform="translate(852,104)" opacity="0.92">
    <g>
      <rect x="0" y="0" width="64" height="64" rx="10" fill="#0d1117" stroke="url(#gold)" stroke-width="2"/>
      <text x="32" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#D4AF37">9a3f</text>
      <text x="32" y="48" text-anchor="middle" font-family="monospace" font-size="13" fill="#D4AF37">c1e0</text>
    </g>
    <line x1="64" y1="32" x2="84" y2="32" stroke="url(#gold)" stroke-width="2"/>
    <g transform="translate(84,0)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="#0d1117" stroke="url(#gold)" stroke-width="2"/>
      <text x="32" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#F0D27A">b7d2</text>
      <text x="32" y="48" text-anchor="middle" font-family="monospace" font-size="13" fill="#F0D27A">4f1a</text>
    </g>
    <line x1="148" y1="32" x2="168" y2="32" stroke="url(#gold)" stroke-width="2"/>
    <g transform="translate(168,0)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="#0d1117" stroke="url(#gold)" stroke-width="2"/>
      <text x="32" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#D4AF37">e0c9</text>
      <text x="32" y="48" text-anchor="middle" font-family="monospace" font-size="13" fill="#D4AF37">77b3</text>
    </g>
    <line x1="232" y1="32" x2="252" y2="32" stroke="url(#gold)" stroke-width="2"/>
    <g transform="translate(252,0)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="#0d1117" stroke="url(#gold)" stroke-width="2"/>
      <text x="32" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#F0D27A">1f5e</text>
      <text x="32" y="48" text-anchor="middle" font-family="monospace" font-size="13" fill="#F0D27A">a92d</text>
    </g>
  </g>

  <!-- bottom accent line -->
  <rect x="224" y="278" width="160" height="4" rx="2" fill="url(#gold)"/>
</svg>
