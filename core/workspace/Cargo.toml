[package]
name = "evorule-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Workspace crate: 多租户工作空间 + 规则元数据管理 (P10 基础设施层)"
repository.workspace = true
# 依赖 path crate (evorule-rule-schema), 与应用层一致保持闭包, 不发布到 crates.io
publish = false

[lints]
# 继承顶层 [workspace.lints] (C4 forbid unsafe / C5 unwrap·expect·panic = deny)
workspace = true

[dependencies]
# SQLite 持久化 (D1 决策: 应用层 DB 选 SQLite)
rusqlite = { version = "0.32", features = ["bundled"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 规则内容哈希 (BLAKE3, 与审计链同源)
# 规范哈希 SSOT (审计⑥ C3): 统一经 evorule-hash, 禁止自写 blake3 口径
evorule-hash = "0.1.3"
# 时间戳
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# 错误传播 (与 evorule-server 保持一致: v2)
thiserror = "2"
# 日志
tracing = "0.1"
# 唯一 ID 生成 (ULID, 字典序可排序)
ulid = "1"
# async trait (Rust 1.74 原生 async trait 尚不完全稳定)
async-trait = "0.1"
# Schema 门禁（线1 防御层）：rule_translate 输出 / 规则提交前的结构校验
evorule-rule-schema = { path = "../rule_schema" }
# HTTP API (与 evorule-server 保持一致: axum 0.8)
axum = "0.8"
# OpenAPI 单一真相源 (P2-1): workspace 端点标注 + 独立 OpenApi 聚合,由 evorule-server 合并
# chrono: models 大量使用 DateTime<Utc>, 开启后生成 string + date-time 格式
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
# tokio 运行时 + 同步原语 (mock_io_responder / session_switched / rolling_session / publish_service 需要)
# - sync: broadcast / Mutex
# - time: drain 超时
# - rt-multi-thread + macros: 测试用 (test 模块内的 #[tokio::test] + Runtime::new)
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
