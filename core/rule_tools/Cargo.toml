[package]
name = "evorule-rule-tools"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-or-later"
description = "EvoRule 规则工具 —— 验证器 + 安全分析"
repository = "https://github.com/evorule/evorule-server"
publish = false
homepage = "https://github.com/evorule/evorule-server"

[[bin]]
name = "evorule-rule-tools"
path = "src/bin/evorule-rule-tools.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# Schema 门禁（线1 防御层）：校验器以固化 v1.0 Schema 为权威基准
evorule-rule-schema = { path = "../rule_schema" }
# law_set 部署件校验（CLI validate 按 kind 自动分流；权威契约自独立仓
# evorule-criticality 受控消费，git + rev 钉版，演进 SOP = 先推独立仓再升 rev）
evorule-law-schema = "0.1.0"

[dev-dependencies]
# handler 层 oneshot 测试
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"

[lints]
# 继承顶层 [workspace.lints] (C4 forbid unsafe / C5 unwrap·expect·panic = deny)
workspace = true
