[package]
name = "evorule-rule-tools"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-or-later"
description = "EvoRule 规则工具 —— 验证器 + 安全分析"
repository = "https://gitee.com/evo-rule-lab/evorule-server"
publish = false
homepage = "https://gitee.com/evo-rule-lab/evorule-server"

[[bin]]
name = "evorule-rule-tools"
path = "src/bin/evorule-rule-tools.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# handler 层 oneshot 测试
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"

[lints]
# 继承顶层 [workspace.lints] (C4 forbid unsafe / C5 unwrap·expect·panic = deny)
workspace = true
