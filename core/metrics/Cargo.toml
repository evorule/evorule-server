[package]
name = "evorule-metrics"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-or-later"
description = "EvoRule Prometheus 指标实现 — 13 个核心 metric + /metrics 端点 (evorule-server 仓配套 lib)"
repository = "https://gitee.com/evorule/evorule-server"
homepage = "https://gitee.com/evorule/evorule-server"
publish = false

[dependencies]
prometheus = "0.13"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# 服务层 HTTP 测试需要 async runtime + mock HTTP server
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
mockito = "1"
# handler 层 oneshot 测试
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"

[lints]
# 继承顶层 [workspace.lints] (C4 forbid unsafe / C5 unwrap·expect·panic = deny)
workspace = true
