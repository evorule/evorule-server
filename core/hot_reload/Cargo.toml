[package]
name = "evorule-hot-reload"
version.workspace = true
edition = "2021"
description = "规则文件热重载服务"
license = "AGPL-3.0-or-later"
repository = "https://gitee.com/evorule/evorule-server"
publish = false
homepage = "https://gitee.com/evorule/evorule-server"

[dependencies]
notify = "6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# : rustls TLS——Linux musl 静态发版构建不依赖系统 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive", "env"] }
# Schema 门禁（线1 防御层）：加载规则文件前校验引擎原生结构
evorule-rule-schema = { path = "../rule_schema" }
# bundle 契约：扫描 rules_dir 时排除 bundle_manifest.json，与 evorule-server 约定一致（SSOT）
evorule-bundle = { version = "0.3.0" }

[dev-dependencies]
# 服务层 HTTP 错误路径测试需要 async runtime + mock HTTP server
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
mockito = "1"
# handler 层 oneshot 测试
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
# loader 测试需要临时目录
tempfile = "3"

[lints]
# 继承顶层 [workspace.lints] (C4 forbid unsafe / C5 unwrap·expect·panic = deny)
workspace = true
