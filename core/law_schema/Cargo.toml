[package]
name = "evorule-law-schema"
version.workspace = true
edition = "2021"
description = "EvoRule Law Set Schema 门禁 —— law_set v1.0 定稿 schema 的内嵌锚、serde 类型与确定性结构校验"
license = "AGPL-3.0-or-later"
repository = "https://github.com/evorule/evorule-server"
publish = false
homepage = "https://github.com/evorule/evorule-server"

[lints]
# 继承顶层 [workspace.lints] (forbid unsafe / unwrap·expect·panic = deny)
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 校验器静态缓存（workspace MSRV 1.74，std LazyLock 需 1.80，用 once_cell）
once_cell = "1"
# JSON Schema 2020-12 校验器（Draft202012）。schema 源文件: schemas/ 下三件。
jsonschema = "0.21"

[build-dependencies]
serde_json = "1"
