[package]
name = "evorule-governance-host"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-or-later"
description = "EvoRule 治理会话宿主 —— SessionManager + Auditor 服务端 fork（含 rehydrate/G6 锚定/EVID 导出面）"
repository = "https://gitee.com/evorule/evorule-server"
publish = false
homepage = "https://gitee.com/evorule/evorule-server"

[dependencies]
evorule-governance = { version = "0.12", features = ["persistence"] }
evorule-reactor = { version = "0.12", features = ["persistence"] }
evorule-tcb = "0.12"
serde_json = "1"
flate2 = "1"
tracing = "0.1"
blake3 = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[features]
default = []
# WAL 持久化（透传 evorule-governance / evorule-reactor 的 persistence）
persistence = ["evorule-governance/persistence", "evorule-reactor/persistence"]

[lints]
# 继承顶层 [workspace.lints] (C4 forbid unsafe / C5 unwrap·expect·panic = deny)
workspace = true
