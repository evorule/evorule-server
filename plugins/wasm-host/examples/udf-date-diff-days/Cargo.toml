[package]
name = "udf-date-diff-days"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust UDF 示例：两日期相差天数（严格公历校验含闰年），供 evorule-wasm-host 加载"

# 脱离上层 workspace（与 plugins/ai-plugin 同一模式）
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
