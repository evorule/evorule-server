[package]
name = "evorule-physics-services"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-or-later"
description = "确定性物理仿真原生服务 —— vendored rpsm-core 内核,以 IoHandler 形式挂载到 evorule-server IoDispatcher(UV-035 第二个原生插件 crate 泛化验证)"
repository = "https://gitee.com/evorule/evorule-server"
publish = false

[lints]
workspace = true

[dependencies]
# 核心层（crates.io 版本依赖，顶层 [patch.crates-io] 覆盖为本地源码）
evorule-tcb = { version = "0.4.0" }
evorule-reactor = { version = "0.4.0" }
# 插件机制公共件(trait/声明项/过滤路由器上提,插件仅自持声明表+薄壳具名路由器)
evorule-plugin-kit = { path = "../../core/plugin-kit" }

serde_json = "1"

# IoHandler trait object-safety
async-trait = "0.1"

[dev-dependencies]
# 测试用 async runtime（#[tokio::test] 需要 macros + rt）
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 内核确定性 BLAKE3 终态哈希断言（tests/test_thermal_determinism.rs，与
# evorule-server/evorule-reactor 同一 blake3 真相源）
blake3 = "1"
