[package]
name = "evorule-ai-plugin"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "ai-plugin external plugin: 服务端驻留 LLM 执行者（服务面 + 自编排审计回路，契约 v1.2；UV-172 L1 地基）"
repository = "https://gitee.com/evorule/evorule-server"
publish = false

# 显式脱离任何上层 workspace（独立插件包：独立版本独立演进，随包装卸）
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
