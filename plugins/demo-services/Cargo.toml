[package]
name = "evorule-demo-services"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-or-later"
description = "yuanze-demos 业务服务 Rust 原生实现 —— 以 IoHandler 形式挂载到 evorule-server IoDispatcher（Phase 1）"
repository = "https://gitee.com/evorule/evorule-server"
publish = false

[lints]
workspace = true

[dependencies]
# 核心层（主仓 0.8.0 已发布 crates.io，纯 version）
evorule-tcb = { version = "0.10" }
evorule-reactor = { version = "0.10" }
evorule-io-handlers = { path = "../../core/io_handlers" }
evorule-rule-schema = { path = "../../core/rule_schema" }
# 插件机制公共件(trait/声明项/过滤路由器上提,插件仅自持声明表+薄壳具名路由器)
evorule-plugin-kit = { path = "../../core/plugin-kit" }

serde_json = "1"
tracing = "0.1"
# llm_advisor 真 LLM 出网（OpenAI 兼容 chat completions）。
# 版本/特性与 evorule-server 侧一致（reqwest 0.12 + rustls-tls），lockfile 已有解析结果，
# 不引入新的下载与特性面；异步出网经 plugin-kit 的 execute_async 扩展点。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# IoHandler trait object-safety
async-trait = "0.1"

[dev-dependencies]
# 测试用 async runtime（#[tokio::test] 需要 macros + rt）
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
