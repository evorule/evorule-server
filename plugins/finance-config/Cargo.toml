[package]
name = "evorule-finance-config-plugin"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "finance-config external plugin: 财务域配置键读写（外部插件包范本——自持服务进程/数据目录/管理面，可拔插，不经宿主编译）"
repository = "https://gitee.com/evorule/evorule-server"
publish = false

# 显式脱离任何上层 workspace（独立插件包：独立版本独立演进，随包装卸）
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
