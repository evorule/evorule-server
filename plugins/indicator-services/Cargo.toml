[package]
name = "evorule-indicator-services"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-or-later"
description = "确定性金融技术指标原生服务 —— Python 参考实现语义逐位对齐的 Rust 重写(UV-037 第三个原生插件 crate 泛化验证:第二种集成模式),以 IoHandler 形式挂载到 evorule-server IoDispatcher"
repository = "https://gitee.com/evorule/evorule-server"
publish = false

[dependencies]
evorule-tcb = { version = "0.3.1" }
evorule-reactor = { version = "0.3.1" }
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
# 测试用 async runtime（#[tokio::test] 需要 macros + rt），与 physics-services 同构
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
