[package]
name = "evorule-flow-studio-plugin"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "flow-studio external plugin: 声明式流程编译器（flow JSON v0 → 内核规则草稿；纯函数编译核 + axum 服务壳，契约 v1.1 §6）"
repository = "https://gitee.com/evorule/evorule-server"
publish = false

# 显式脱离任何上层 workspace（独立插件包：独立版本独立演进，随包装卸）
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
