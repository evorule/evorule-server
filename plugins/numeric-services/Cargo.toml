[package]
name = "evorule-numeric-services"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-or-later"
description = "精确算术原生服务(有理数/定点十进制/数论原子/利息摊销/单位换算/量纲感知求值)——纯计算,以 IoHandler 形式挂载到 evorule-server IoDispatcher"
repository = "https://gitee.com/evorule/evorule-server"
publish = false

[lints]
workspace = true

[dependencies]
# 核心层（主仓已发布 crates.io,纯 version——接入铁律:不依赖主仓源码路径）
evorule-tcb = { version = "0.11" }
evorule-reactor = { version = "0.11" }
# 插件机制公共件(trait/声明项/过滤路由器上提,插件仅自持声明表+薄壳具名路由器)
evorule-plugin-kit = { path = "../../core/plugin-kit" }
# 量纲感知求值复用推理家族的 SI 量纲原语(同仓 workspace 内,单源不漂移)
evorule-inference-services = { path = "../inference-services" }

# IoHandler trait object-safety
async-trait = "0.1"
# 精确算术核心(项目方批准的新增依赖):大整数与任意精度有理数,纯 Rust 零 unsafe
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[dev-dependencies]
# 测试用 async runtime（#[tokio::test] 需要 macros + rt）
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# SSOT 守卫测试与黄金向量载入:声明表/向量 vs official_native_services.json 对比
serde_json = "1"
# 随机性质面:表达式代数恒等式与舍入/往返不变量
proptest = "1"
