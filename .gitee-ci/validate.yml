# Gitee Go pipeline for evorule-server
# Parity with .github/workflows/ci.yml
#
# Gitee Go does not support actions/checkout, so we use git clone explicitly.
# evorule-server 仓独立 release,evorule 核心从 crates.io 拉取,不需要 checkout 其他仓.

stages:
  - validate
  - lint
  - test
  - build
  - docker

variables:
  GIT_DEPTH: "20"

# === 0. 文档安全 + 版本一致性（各仓独立发布 · 强阻塞）===
validate-pr:
  stage: validate
  image: mcr.microsoft.com/powershell:lts-nanoserver-1809
  script:
    # VERSION_STRATEGY 基线五件套
    - pwsh -NoProfile -File scripts/validate-version.ps1
    - pwsh -NoProfile -File scripts/validate-changelog.ps1
    - pwsh -NoProfile -File scripts/validate-license.ps1
    - pwsh -NoProfile -File scripts/validate-cargolock.ps1
    - pwsh -NoProfile -File scripts/validate-release.ps1 -SkipTagCheck
    # 文档安全 + 引用完整性 + 基调合规（强阻塞）
    # 7 类检查：R-门控1 staged文档泄露 / R3 L1私有路径泄露 / L1不提L2L3 / R-兄弟仓零谈论 / R-agent身份零泄露 / 交叉引用完整性 / DOCS_INDEX索引存在性
    - python3 --version || python --version
    - python scripts/check_doc_safety.py --skip-git
  rules:
    - changes:
        - Cargo.toml
        - "**/Cargo.toml"
        - "**/CHANGELOG.md"
        - "**/LICENSE"
        - "scripts/**"
        - "VERSION_STRATEGY.md"
        - "*.md"
        - "docs/**/*"

# === 1. Clippy + fmt ===
lint:
  stage: lint
  image: rust:1.92-slim
  script:
    - apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev pkg-config git
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
  rules:
    - changes:
        - "**/*.rs"
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - ".gitee-ci/**"

# === 2. Rust tests ===
test:
  stage: test
  image: rust:1.92-slim
  script:
    - apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev pkg-config git
    - cargo test --workspace --all-features
  rules:
    - changes:
        - "**/*.rs"
        - "**/Cargo.toml"
        - "**/Cargo.lock"

# === 3. Release build ===
build:
  stage: build
  image: rust:1.92-slim
  script:
    - apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev pkg-config git
    - cargo build --release --bin evorule-server
  artifacts:
    name: "evorule-server-linux-x86_64"
    paths:
      - target/release/evorule-server
    expire_in: 7 days
  rules:
    - changes:
        - "**/*.rs"
        - "**/Cargo.toml"
        - "**/Cargo.lock"

# === 4. Docker image build (no push) ===
docker:
  stage: docker
  image: docker:24-dind
  services:
    - docker:24-dind
  dependencies:
    - build
  script:
    - docker build -t evorule-server:gitee-$CI_COMMIT_SHORT_SHA .
    - docker run --rm -d -p 18080:18080 -e EVORULE_ADDR=127.0.0.1:18080 --name evorule-smoke evorule-server:gitee-$CI_COMMIT_SHORT_SHA
    - sleep 5
    - wget -qO- http://127.0.0.1:18080/api/health || (docker logs evorule-smoke; exit 1)
    - docker stop evorule-smoke || true
  rules:
    - changes:
        - "Dockerfile"
        - ".dockerignore"
        - "evorule-server/**"
        - "core/**"
        - "resources/**"
        - ".gitee-ci/**"
